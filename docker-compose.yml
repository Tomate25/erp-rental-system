services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend-web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - erp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/erp_prod?schema=public
      - JWT_ACCESS_SECRET=prod_secret_key_antigravity_erp_2026
      - JWT_REFRESH_SECRET=prod_refresh_secret_antigravity_erp_2026
      - JWT_ACCESS_EXPIRATION=8h
      - JWT_REFRESH_EXPIRATION=7d
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=erp_prod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis-cache
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
