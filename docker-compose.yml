services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend-web
    restart: always
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend-api
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/erp_prod?schema=public}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-bm_access_secret_production_2026_super_secure_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-bm_refresh_secret_production_2026_super_secure_key}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-8h}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - PORT=3000
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-loopback,uniquelocal}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/api/v1/health'', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=erp_prod
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis-cache
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
