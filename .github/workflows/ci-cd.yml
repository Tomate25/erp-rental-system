# Este workflow NO requiere secretos de GitHub: las credenciales del CI se generan al azar por job
# (paso 'Generate ephemeral CI credentials') y la base de pruebas efimera usa auth 'trust'.
# Nombres de secretos de PRODUCCION (valores solo en el .env del servidor, nunca en el repo):
#   POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, ADMIN_INITIAL_PASSWORD,
#   SMTP_APP_PASSWORD, WHATSAPP_ACCESS_TOKEN, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY
name: ERP CI/CD Pipeline (Build, Test & Deployment)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Minimo privilegio para el GITHUB_TOKEN: el unico job solo lee el repositorio
# (checkout) y no publica nada. Si un job futuro necesita mas, ampliar SOLO en ese job.
permissions:
  contents: read

jobs:
  ci-testing-and-build:
    name: 🛡️ Testing, Prisma Ephemeral DB & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: erp_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🐙 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install reproducible dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Generate ephemeral CI credentials (no stored secrets)
        run: |
          # Valores aleatorios solo para este job: no hay secretos ni literales en el repo.
          # Funciona tambien en PRs desde forks (no depende de secrets.*).
          for name in JWT_ACCESS_SECRET JWT_REFRESH_SECRET ADMIN_INITIAL_PASSWORD POSTGRES_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: 🗄️ Setup Ephemeral PostgreSQL & Prisma Migration
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5432/erp_test_db?schema=public"
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: 🧪 Execute backend tests with coverage thresholds and frontend tests
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5432/erp_test_db?schema=public"
        run: |
          npm --prefix backend run test:cov -- --runInBand
          npm --prefix frontend run test

      - name: 🔌 Execute backend E2E tests
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5432/erp_test_db?schema=public"
        run: npm --prefix backend run test:e2e

      - name: 🧹 Execute linters
        run: |
          npm --prefix backend run lint -- --no-fix
          npm --prefix frontend run lint

      - name: 🏗️ Compile Production Artifacts (npm run build:all)
        run: npm run build:all

      - name: 🔐 Audit production dependencies
        run: |
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high

      - name: 🐳 Validate Docker Production Composition
        env:
          DATABASE_URL: "postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@postgres:5432/erp_prod?schema=public"
        run: docker compose config --quiet
