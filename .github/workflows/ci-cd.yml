name: ERP CI/CD Pipeline (Build, Test & Deployment)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci-testing-and-build:
    name: 🛡️ Testing, Prisma Ephemeral DB & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: erp_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🐙 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install reproducible dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: 🗄️ Setup Ephemeral PostgreSQL & Prisma Migration
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/erp_test_db?schema=public"
          JWT_ACCESS_SECRET: "ci-only-access-secret-not-used-outside-ephemeral-tests"
          JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-used-outside-ephemeral-tests"
          ADMIN_INITIAL_PASSWORD: "ci-only-admin-password"
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: 🧪 Execute backend tests with coverage thresholds and frontend tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/erp_test_db?schema=public"
          JWT_ACCESS_SECRET: "ci-only-access-secret-not-used-outside-ephemeral-tests"
          JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-used-outside-ephemeral-tests"
        run: |
          npm --prefix backend run test:cov -- --runInBand
          npm --prefix frontend run test

      - name: 🔌 Execute backend E2E tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/erp_test_db?schema=public"
          JWT_ACCESS_SECRET: "ci-only-access-secret-not-used-outside-ephemeral-tests"
          JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-used-outside-ephemeral-tests"
        run: npm --prefix backend run test:e2e

      - name: 🧹 Execute linters
        run: |
          npm --prefix backend run lint -- --no-fix
          npm --prefix frontend run lint

      - name: 🏗️ Compile Production Artifacts (npm run build:all)
        run: npm run build:all

      - name: 🔐 Audit production dependencies
        run: |
          npm audit --prefix backend --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high

      - name: 🐳 Validate Docker Production Composition
        env:
          DATABASE_URL: "postgresql://postgres:compose-validation@postgres:5432/erp_prod?schema=public"
          JWT_ACCESS_SECRET: "compose-validation-access-secret"
          JWT_REFRESH_SECRET: "compose-validation-refresh-secret"
          POSTGRES_PASSWORD: "compose-validation-password"
        run: docker compose config --quiet
